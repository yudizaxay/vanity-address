name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # vanity-core + vanity-address — no GTK/WebKit system deps required
  cli:
    name: CLI & core (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.label == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build release
        run: cargo build --release -p vanity-address

      - name: Run tests
        run: cargo test -p vanity-core -p vanity-address

      - name: Clippy
        run: cargo clippy -p vanity-core -p vanity-address -- -D warnings

  # vanity-app (Tauri) — validate on macOS + Windows (Linux needs WebKit/GTK)
  desktop:
    name: Desktop app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vanity-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: vanity-app
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: vanity-app
        run: npm run build

      - name: Run tests
        run: cargo test -p vanity-app

      - name: Clippy
        run: cargo clippy -p vanity-app -- -D warnings

  # vanity-wasm + the npm package's programmatic SDK (generateAddress()).
  # Linux is used because Ubuntu's clang ships the WebAssembly LLVM target by
  # default (unlike macOS's Apple-trimmed clang), so no extra toolchain setup
  # is normally needed for secp256k1-sys's vendored C code to target wasm32 —
  # the guard step below self-heals if that's ever not the case.
  wasm-sdk:
    name: WASM SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Ensure clang supports wasm32 (needed by secp256k1-sys)
        run: |
          if ! clang --print-targets 2>/dev/null | grep -q WebAssembly; then
            sudo apt-get update && sudo apt-get install -y clang lld
          fi
          clang --print-targets | grep -q WebAssembly || { echo "clang lacks the wasm32 target"; exit 1; }

      - name: Check vanity-wasm compiles for wasm32
        run: cargo check -p vanity-wasm --target wasm32-unknown-unknown

      - name: Clippy (vanity-wasm, wasm32 target)
        run: cargo clippy -p vanity-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build wasm SDK artifacts
        run: ./scripts/build-wasm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run npm SDK tests
        working-directory: npm/vanity-address
        run: npm test

[package]
name = "vanity-core"
version = "0.3.8"
edition = "2021"
description = "Multi-chain vanity address grinding core library"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/yudizaxay/vanity-address"
homepage = "https://github.com/yudizaxay/vanity-address"
documentation = "https://docs.rs/vanity-core"
keywords = ["vanity", "cryptocurrency", "wallet", "blockchain", "keypair"]
categories = ["cryptography"]

[dependencies]
rayon = { version = "1.7", optional = true }
secp256k1 = { version = "0.29", features = ["rand"] }
ed25519-dalek = "1"
sha3 = "0.12"
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.12"
blake2 = "0.10"
stellar-strkey = "0.0.9"
rand = "0.8"
hex = "0.4"
bs58 = "0.5"
sysinfo = { version = "0.33", optional = true }
data-encoding = "2"
crc32fast = "1"
base64 = "0.23"
getrandom = { version = "0.2", features = ["js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solana-sdk = "1.18"

[features]
default = ["native"]
native = ["dep:rayon", "dep:sysinfo"]
wasm = ["dep:getrandom"]

[package]
name = "vanity-wasm"
version = "0.3.8"
edition = "2021"
description = "WASM bindings for vanity-core, used by the vanity-address npm package's programmatic API"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vanity-core = { path = "../vanity-core", version = "0.3.8", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
